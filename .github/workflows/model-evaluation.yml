name: Model Evaluation and Promotion

on:
  push:
    branches: [main]
  workflow_dispatch:  # also allows manually triggering a run from the GitHub UI

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # mlflow.db only holds METADATA (run params, metrics, registry aliases).
      # The actual model artifact FILES live in a separate mlruns/ directory
      # on local disk -- both are gitignored (correctly, they're generated
      # artifacts), which means BOTH need to be cached together, or the
      # registry's metadata will point to artifact files that don't exist on
      # a fresh runner. This was the root cause of "No such artifact: ''".
      - name: Restore MLflow tracking store + artifacts from previous run
        uses: actions/cache@v4
        with:
          path: |
            mlflow.db
            mlruns
          key: mlflow-store-${{ github.run_id }}
          restore-keys: |
            mlflow-store-

      - name: Run data ingestion
        run: python src/spark_ingest.py

      - name: Validate data contract
        run: python src/validate_data.py data/spark_cleaned_churn.csv

      - name: Train and register challenger model
        run: |
          python src/train.py
          python src/register_model.py

      - name: Evaluate challenger vs champion, promote if better
        run: python tests/evaluate_and_promote.py